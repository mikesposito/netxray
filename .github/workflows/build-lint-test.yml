name: Build, Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --verbose

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release